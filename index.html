<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="config/main.css" />
    <script src="config/main.js" type="module"></script>
  </head>
  <body>
    <div class="center">
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <div class="center">
      <input type="text" id="searchInput" placeholder="Search games" />
    </div>
    <div id="gamesContainer"></div>
    
    <div class="footer">
      <a style="font-weight: 700">a site by </a>
      <a style="font-weight: 700" class="link" href="https://dsc.gg/parcoil">parcoil network</a>
    </div>

    <!-- Game Modal Popup (Hidden by default) -->
    <div id="gameModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000;">
      <div style="position:relative; width:90%; height:90%; margin:2% auto; background:#000;">
        <button onclick="closeGame()" style="position:absolute; top:-40px; right:0; background:red; color:white; border:none; padding:10px 20px; cursor:pointer; font-weight:bold;">CLOSE GAME</button>
        <iframe id="gameFrame" src="" style="width:100%; height:100%; border:none;"></iframe>
      </div>
    </div>
  </body>
</html>
